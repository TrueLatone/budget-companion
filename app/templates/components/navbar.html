{% from 'components/icons.html' import icon %}
{% set home_url = url_for('core.home') %}
<header class="navbar navbar-expand-lg bc-nav">
  <div class="bc-container bc-nav-inner">
    <a class="bc-brand" href="{{ home_url }}" aria-label="{{ t('brand_home') }}">
      <span class="bc-brand-mark" aria-hidden="true">{{ icon('sprout') }}</span>
      <span>Budget Companion</span>
    </a>
    <button class="navbar-toggler bc-nav-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="{{ t('open_menu') }}">
      {{ icon('menu') }}
    </button>
    <nav class="collapse navbar-collapse bc-nav-links" id="mainNav" aria-label="{{ t('main_navigation') }}">
      <div class="bc-nav-menu">
        <a class="bc-nav-link{% if request.endpoint == 'core.home' %} is-active{% endif %}" href="{{ home_url }}"{% if request.endpoint == 'core.home' %} aria-current="page"{% endif %}>{{ t('home') }}</a>
        <a class="bc-nav-link" href="{{ home_url }}#tinh-nang">{{ t('features') }}</a>
        <a class="bc-nav-link" href="{{ home_url }}#cach-su-dung">{{ t('how_it_works') }}</a>
      </div>
      <div class="bc-nav-actions">
        <div class="bc-language-switcher" role="group" aria-label="{{ t('language_switcher') }}">
          {% for code in ('en', 'vi') %}
          <a class="bc-language-option{% if ui_locale == code %} is-active{% endif %}" href="{{ language_url(code) }}" hreflang="{{ code }}" lang="{{ code }}"{% if ui_locale == code %} aria-current="true"{% endif %}>{{ code|upper }}</a>
          {% endfor %}
        </div>
        <a class="bc-text-link" href="{{ url_for('accounts.index') }}">{{ t('log_in') }}</a>
        <a class="bc-button bc-button-primary bc-button-small" href="{{ url_for('budgets.index') }}">{{ t('get_started') }}</a>
      </div>
    </nav>
  </div>
</header>
